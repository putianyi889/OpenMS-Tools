<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据明细 - 用户视频数据</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <h1>数据明细</h1>
  <p class="subtitle">
    GET /api/userprofile/videolist · 
    <a href="index.html" id="backLink" style="color:#58a6ff;">返回导航</a> · 
    <a href="#" id="refreshLink" style="color:#d29922;">强制刷新</a>
  </p>

  <div class="status" id="status"></div>

  <div class="table-section">
    <h3>📋 视频明细
      <span id="tableCount" style="color:#8b949e;font-weight:400;"></span>
    </h3>
    <div class="table-wrap">
      <table id="dataTable">
        <thead>
          <tr>
            <th onclick="sortTable('id')">ID</th>
            <th onclick="sortTable('player')">玩家</th>
            <th onclick="sortTable('software')">软件</th>
            <th onclick="sortTable('level')">等级</th>
            <th onclick="sortTable('mode')">模式</th>
            <th onclick="sortTable('state')">状态</th>
            <th onclick="sortTable('cl')">CL</th>
            <th onclick="sortTable('ce')">CE</th>
            <th onclick="sortTable('timems')">耗时(ms)</th>
            <th onclick="sortTable('bv')">BV</th>
            <th onclick="sortTable('upload_time')">上传时间</th>
            <th onclick="sortTable('end_time')">结束时间</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/cacheDb.js"></script>
  <script src="js/cache.js"></script>
  <script src="js/api.js"></script>
  <script src="js/table.js"></script>
</body>
</html>
