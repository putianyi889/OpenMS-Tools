<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图表分析 - 用户视频数据</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <h1>图表分析</h1>
  <p class="subtitle">
    GET /api/userprofile/videolist · 
    <a href="index.html" id="backLink" style="color:#58a6ff;">返回导航</a> · 
    <a href="#" id="refreshLink" style="color:#d29922;">强制刷新</a>
  </p>

  <div class="status" id="status"></div>

  <div class="charts-grid">
    <div class="chart-card"><h3>📈 上传趋势（按天）</h3><canvas id="chartUploadTrend"></canvas></div>
    <div class="chart-card"><h3>🎮 软件分布</h3><canvas id="chartSoftware"></canvas></div>
    <div class="chart-card"><h3>📊 等级分布</h3><canvas id="chartLevel"></canvas></div>
    <div class="chart-card"><h3>🎯 模式分布</h3><canvas id="chartMode"></canvas></div>
    <div class="chart-card"><h3>🔄 状态分布</h3><canvas id="chartState"></canvas></div>
    <div class="chart-card"><h3>⏱️ 耗时分布（timems）</h3><canvas id="chartTimems"></canvas></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/cacheDb.js"></script>
  <script src="js/cache.js"></script>
  <script src="js/api.js"></script>
  <script src="js/charts/uploadTrend.js"></script>
  <script src="js/charts/software.js"></script>
  <script src="js/charts/level.js"></script>
  <script src="js/charts/mode.js"></script>
  <script src="js/charts/state.js"></script>
  <script src="js/charts/timems.js"></script>
  <script src="js/charts/main.js"></script>
</body>
</html>
