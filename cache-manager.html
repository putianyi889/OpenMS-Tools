<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>缓存管理 - 用户视频数据</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/cache-manager.css">
  <link rel="stylesheet" href="css/batch-loader.css">
</head>
<body>
  <h1>缓存管理</h1>
  <p class="subtitle">
    IndexedDB · 缓存永久有效，需手动刷新 ·
    <a href="index.html" style="color:#58a6ff;">返回导航</a>
  </p>

  <div class="controls">
    <button onclick="refreshList()">🔄 刷新列表</button>
    <button class="danger" onclick="clearAllCaches()">🗑️ 清空全部缓存</button>
    <span class="status" id="status"></span>
  </div>

  <div class="summary" id="summary"></div>

  <div class="batch-section">
    <h3>📦 批量加载用户</h3>
    <div class="controls">
      <label for="batchFrom">起始 ID:</label>
      <input type="number" id="batchFrom" value="1" min="1">
      <label for="batchTo">结束 ID:</label>
      <input type="number" id="batchTo" value="10" min="1">
      <label class="checkbox-label">
        <input type="checkbox" id="batchSkipCached" checked>
        跳过已缓存
      </label>
      <button id="batchStart" onclick="startBatchLoad()">开始加载</button>
      <button id="batchCancel" class="danger" onclick="cancelBatchLoad()" disabled>取消</button>
    </div>
    <div class="batch-progress" id="batchProgress"></div>
  </div>

  <div class="batch-section">
    <h3>🔁 重算所有 PB</h3>
    <p class="hint">遍历所有已缓存用户，从其视频数据重新计算 PB 并覆盖写入。</p>
    <div class="controls">
      <button id="recalcStart" onclick="recalcAllPBs()">开始重算</button>
    </div>
    <div class="batch-progress" id="recalcProgress"></div>
  </div>

  <div class="batch-section">
    <h3>🏆 刷新排行</h3>
    <p class="hint">重算每条 PB 在其 (level, bv) 下的排名，写入 pbs 缓存。</p>
    <div class="controls">
      <button id="recalcRanksStart" onclick="recalcAllRanksUI()">刷新排行</button>
    </div>
    <div class="batch-progress" id="rankProgress"></div>
  </div>

  <div class="batch-section">
    <h3>📐 重算支撑线</h3>
    <p class="hint">遍历所有已缓存用户，重算 I / E 级的支撑线并写入 pbs.support（B 级不参与）。</p>
    <div class="controls">
      <button id="recalcSupportStart" onclick="recalcSupportLinesUI()">重算支撑线</button>
    </div>
    <div class="batch-progress" id="supportProgress"></div>
  </div>

  <div class="cache-table-section">
    <table id="cacheTable">
      <thead>
        <tr>
          <th>用户 ID</th>
          <th>记录数</th>
          <th>占用大小</th>
          <th>缓存时间</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="cacheTableBody"></tbody>
    </table>
    <div id="emptyState" class="empty-state" style="display:none;">暂无缓存数据</div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/requestQueue.js"></script>
  <script src="js/cacheDb.js"></script>
  <script src="js/cache.js"></script>
  <script src="js/api.js"></script>
  <script src="js/pb/pbFormat.js"></script>
  <script src="js/pb/pbLevel.js"></script>
  <script src="js/pb/pbLevels.js"></script>
  <script src="js/pb/pbCache.js"></script>
  <script src="js/pb/supportLine.js"></script>
  <script src="js/cacheManager.js"></script>
  <script src="js/batchLoader.js"></script>
  <script src="js/recalcPBs.js"></script>
</body>
</html>
