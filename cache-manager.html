<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>缓存管理 - 用户视频数据</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/cache-manager.css">
  <link rel="stylesheet" href="css/batch-loader.css">
</head>
<body>
  <h1>缓存管理</h1>
  <p class="subtitle">
    IndexedDB · 缓存永久有效，需手动刷新 ·
    <a href="index.html" style="color:#58a6ff;">返回导航</a>
  </p>

  <div class="controls">
    <button onclick="refreshList()">🔄 刷新列表</button>
    <button class="danger" onclick="clearAllCaches()">🗑️ 清空全部缓存</button>
    <span class="status" id="status"></span>
  </div>

  <div class="summary" id="summary"></div>

  <div class="batch-section">
    <h3>👤 同步用户信息</h3>
    <p class="hint">增量拉取自上次同步后被更新的用户信息（走 RequestQueue 限流）。</p>
    <div class="controls">
      <button id="userSyncStart" onclick="syncUserInfo()">同步用户信息</button>
      <span id="userSyncMeta" class="hint"></span>
    </div>
    <div class="batch-progress" id="userSyncProgress"></div>
  </div>

  <div class="batch-section">
    <h3>📦 批量加载用户</h3>
    <div class="controls">
      <label for="batchFrom">起始 ID:</label>
      <input type="number" id="batchFrom" value="1" min="1">
      <label for="batchTo">结束 ID:</label>
      <input type="number" id="batchTo" value="10" min="1">
      <label class="checkbox-label">
        <input type="checkbox" id="batchSkipCached" checked>
        跳过已缓存
      </label>
      <button id="batchStart" onclick="startBatchLoad()">开始加载</button>
      <button id="batchCancel" class="danger" onclick="cancelBatchLoad()" disabled>取消</button>
    </div>
    <div class="batch-progress" id="batchProgress"></div>
  </div>

  <div class="batch-section">
    <h3>🔁 一键重算全部</h3>
    <p class="hint">
      依次重算：PB → 排行 → 支撑线 → 前端成绩。使用已缓存的视频数据，无网络请求。
    </p>
    <div class="controls">
      <button id="recalcAllStart" onclick="recalcEverything()">开始重算</button>
    </div>
    <div class="batch-progress" id="recalcAllProgress"></div>
  </div>

  <div class="cache-table-section">
    <table id="cacheTable">
      <thead>
        <tr>
          <th>用户 ID</th>
          <th>记录数</th>
          <th>占用大小</th>
          <th>缓存时间</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="cacheTableBody"></tbody>
    </table>
    <div id="emptyState" class="empty-state" style="display:none;">暂无缓存数据</div>
  </div>

  <<script src="js/deps.js"></script>
  <script src="js/loader.js" data-entry="cacheManager,batchLoader,recalcPBs,userCache,userSyncUI"></script>
</body>
</html>
